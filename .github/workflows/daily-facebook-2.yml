name: Facebook Ads Daily ETL - Batch B

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1-6" # Monday-Saturday
    - cron: "0 1 * * 0" # Sunday

concurrency:
  group: facebook-batch-b
  cancel-in-progress: false

jobs:
  facebook_etl:
    strategy:
      matrix:
        group: [d1b, m4b, d2b, m8b]
      fail-fast: false
      max-parallel: 1
    uses: ./.github/workflows/_reusable-etl.yml
    with:
      pipeline: facebook
      group: ${{ matrix.group }}
    secrets: inherit
