name: Facebook Ads Daily ETL - Batch A

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1-6" # Monday-Saturday
    - cron: "0 0 * * 0" # Sunday

concurrency:
  group: facebook-batch-a
  cancel-in-progress: false

jobs:
  facebook_etl:
    strategy:
      matrix:
        group: [d1a, m4a, d2a, m8a]
      fail-fast: false
      max-parallel: 1
    uses: ./.github/workflows/_reusable-etl.yml
    with:
      pipeline: facebook
      group: ${{ matrix.group }}
    secrets: inherit
