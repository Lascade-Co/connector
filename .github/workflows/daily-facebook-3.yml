name: Facebook Ads Daily ETL - Batch C

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1-6" # Monday-Saturday
    - cron: "0 2 * * 0" # Sunday

concurrency:
  group: facebook-batch-c
  cancel-in-progress: false

jobs:
  facebook_etl:
    strategy:
      matrix:
        group: [d1c, m4c, d2c]
      fail-fast: false
      max-parallel: 1
    uses: ./.github/workflows/_reusable-etl.yml
    with:
      pipeline: facebook
      group: ${{ matrix.group }}
    secrets: inherit
