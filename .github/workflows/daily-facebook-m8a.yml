name: Facebook Ads Daily ETL - m8a (GBP)

# Isolated schedule for the m8 family while its GBP -> AED conversion is being
# proven. Deliberately not part of Batch A: one workflow per group means one
# load per day against the shared fb_ads_m8a dlt state.

on:
  workflow_dispatch:
    inputs:
      creative_refresh_mode:
        description: "Creative refresh mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - incremental
          - full
  schedule:
    - cron: "0 7 * * 1-6" # Incremental Monday-Saturday
    - cron: "0 7 * * 0" # Sunday full reconciliation replaces the daily run

concurrency:
  group: facebook-m8a
  cancel-in-progress: false

jobs:
  facebook_etl:
    strategy:
      matrix:
        group: [m8a]
      fail-fast: false
      max-parallel: 1
    uses: ./.github/workflows/_reusable-etl.yml
    with:
      pipeline: facebook
      group: ${{ matrix.group }}
      facebook_creative_refresh_mode: ${{ github.event_name == 'schedule' && github.event.schedule == '0 7 * * 0' && 'full' || github.event_name == 'workflow_dispatch' && inputs.creative_refresh_mode || 'auto' }}
    secrets: inherit
