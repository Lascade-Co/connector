# put your configuration values here

[runtime]
log_level="WARNING"  # the system log level of dlt
# use the dlthub_telemetry setting to enable/disable anonymous usage data reporting, see https://dlthub.com/docs/reference/telemetry
dlthub_telemetry = false

[load]
# clickhouse-connect's shared HTTP pool defaults to 8 connections. Keep load
# concurrency below that ceiling so loader jobs do not discard pooled sockets.
workers = 4
# A merge job blocked on a ClickHouse mutation is not helped by retrying: the
# abandoned query keeps running server-side and each attempt queues another
# mutation behind it, so the default of 5 turns one stall into a 25-minute pileup.
# Allow a single retry for genuine transients, then fail fast and visibly.
raise_on_max_retries = 2

[sources.facebook_ads]
account_id = "344051707969015" # please set me up!

[sources.google_analytics]
# Property ID is now configured per-group in secrets/google_analytics.json
# This section is kept for backward compatibility with the original dlt setup
property_id = 0 # Not used in production - configured via group secrets
